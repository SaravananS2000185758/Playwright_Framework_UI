name: Playwright Automation Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run regression tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:

  # ============================================================================
  # JOB 1: Full test suite on push to main/develop (all browsers)
  # ============================================================================
  test:
    name: Playwright Tests - ${{ matrix.browser }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        browser: [chromium, firefox, webkit]
        node-version: [18.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright tests - ${{ matrix.browser }}
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          CI: true
          HEADLESS: true
          BASE_URL: ${{ secrets.BASE_URL || 'https://automationexercise.com/' }}
          LOG_LEVEL: info
          WORKERS: 4

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: html-report-${{ matrix.os }}-${{ matrix.browser }}
          path: reports/html-report/
          retention-days: 30

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: logs-${{ matrix.os }}-${{ matrix.browser }}
          path: reports/logs/
          retention-days: 30

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: junit-${{ matrix.os }}-${{ matrix.browser }}
          path: reports/junit.xml
          retention-days: 30

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: reports/junit.xml
          check_name: Test Results - ${{ matrix.os }} - ${{ matrix.browser }}

  # ============================================================================
  # JOB 2: Smoke tests on PR (Chromium only - fast feedback)
  # ============================================================================
  smoke-tests:
    name: Smoke Tests (PR Validation)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npx playwright test --grep @smoke --project=chromium
        env:
          CI: true
          HEADLESS: true
          BASE_URL: ${{ secrets.BASE_URL || 'https://automationexercise.com/' }}
          LOG_LEVEL: info

      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: smoke-test-report
          path: reports/html-report/
          retention-days: 7

  # ============================================================================
  # JOB 3: Scheduled daily regression tests
  # ============================================================================
  regression-tests:
    name: Daily Regression Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run regression tests
        run: npx playwright test --grep @regression --workers=4
        env:
          CI: true
          HEADLESS: true
          BASE_URL: ${{ secrets.BASE_URL || 'https://automationexercise.com/' }}
          LOG_LEVEL: info

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: regression-report
          path: reports/html-report/
          retention-days: 30

      - name: Upload regression logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: regression-logs
          path: reports/logs/
          retention-days: 30

  # ============================================================================
  # JOB 4: Notify on failure
  # ============================================================================
  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [test]
    if: failure()

    steps:
      - name: Send Slack notification on failure
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "❌ Playwright tests failed!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Playwright Tests Failed*\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref }}\nCommit: ${{ github.sha }}"
                  }
                }
              ]
            }
