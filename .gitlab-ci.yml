# GitLab CI/CD Pipeline for Playwright Automation Framework
# This pipeline runs comprehensive UI automation tests with multi-browser support
# Reference: https://docs.gitlab.com/ee/ci/

# Define CI/CD variables
variables:
  NODE_VERSION: "18.20.0"
  WORKERS: "4"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"

# Define pipeline stages
stages:
  - install
  - test
  - smoke
  - report
  - cleanup

# Cache configuration for faster builds
cache:
  key: ${CI_COMMIT_REF_SLUG}-npm
  paths:
    - .npm/
    - node_modules/
  policy: pull-push

# Artifacts retention policy
artifacts:
  expire_in: 30 days
  when: always
  reports:
    junit: reports/junit.xml

# ============================================================================
# STAGE 1: INSTALL - Setup dependencies and browsers
# ============================================================================

install:dependencies:
  stage: install
  image: node:${NODE_VERSION}-alpine
  script:
    - echo "📦 Installing Node dependencies..."
    - npm ci --cache .npm --prefer-offline
    - echo "✅ Dependencies installed successfully"
  artifacts:
    paths:
      - node_modules/
      - package-lock.json
    expire_in: 1 hour
  only:
    - merge_requests
    - main
    - develop
    - schedules
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

install:browsers:
  stage: install
  image: node:${NODE_VERSION}
  needs:
    - install:dependencies
  script:
    - echo "🎭 Installing Playwright browsers..."
    - npx playwright install --with-deps chromium firefox webkit
    - echo "✅ Browsers installed successfully"
  artifacts:
    paths:
      - node_modules/.bin/
      - ~/.cache/ms-playwright/
    expire_in: 2 hours
  only:
    - merge_requests
    - main
    - develop
    - schedules
  cache:
    key: ${CI_COMMIT_REF_SLUG}-playwright
    paths:
      - ~/.cache/ms-playwright/
    policy: pull-push
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# ============================================================================
# STAGE 2: TEST - Run comprehensive tests on all browsers
# ============================================================================

test:chromium:
  stage: test
  image: node:${NODE_VERSION}
  needs:
    - install:dependencies
    - install:browsers
  script:
    - echo "🚀 Running Chromium tests..."
    - npx playwright test --project=chromium --workers=${WORKERS}
    - echo "✅ Chromium tests completed"
  artifacts:
    paths:
      - reports/
    reports:
      junit: reports/junit.xml
    expire_in: 30 days
  environment:
    name: test-chromium
    url: $CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/reports/html-report/index.html
  variables:
    BASE_URL: "${BASE_URL:-http://localhost:3000}"
    CI: "true"
  only:
    - merge_requests
    - main
    - develop
    - schedules
  allow_failure: false
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

test:firefox:
  stage: test
  image: node:${NODE_VERSION}
  needs:
    - install:dependencies
    - install:browsers
  script:
    - echo "🚀 Running Firefox tests..."
    - npx playwright test --project=firefox --workers=${WORKERS}
    - echo "✅ Firefox tests completed"
  artifacts:
    paths:
      - reports/
    reports:
      junit: reports/junit.xml
    expire_in: 30 days
  environment:
    name: test-firefox
    url: $CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/reports/html-report/index.html
  variables:
    BASE_URL: "${BASE_URL:-http://localhost:3000}"
    CI: "true"
  only:
    - merge_requests
    - main
    - develop
    - schedules
  allow_failure: false
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

test:webkit:
  stage: test
  image: node:${NODE_VERSION}
  needs:
    - install:dependencies
    - install:browsers
  script:
    - echo "🚀 Running WebKit tests..."
    - npx playwright test --project=webkit --workers=${WORKERS}
    - echo "✅ WebKit tests completed"
  artifacts:
    paths:
      - reports/
    reports:
      junit: reports/junit.xml
    expire_in: 30 days
  environment:
    name: test-webkit
    url: $CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/reports/html-report/index.html
  variables:
    BASE_URL: "${BASE_URL:-http://localhost:3000}"
    CI: "true"
  only:
    - merge_requests
    - main
    - develop
    - schedules
  allow_failure: false
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# ============================================================================
# STAGE 3: SMOKE - Run smoke tests (critical tests only)
# ============================================================================

smoke:tests:
  stage: smoke
  image: node:${NODE_VERSION}
  needs:
    - install:dependencies
    - install:browsers
  script:
    - echo "🔥 Running smoke tests..."
    - npx playwright test --grep @smoke --workers=${WORKERS}
    - echo "✅ Smoke tests completed"
  artifacts:
    paths:
      - reports/
    reports:
      junit: reports/junit.xml
    expire_in: 30 days
  environment:
    name: smoke-tests
    url: $CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/reports/html-report/index.html
  variables:
    BASE_URL: "${BASE_URL:-http://localhost:3000}"
    CI: "true"
  only:
    - merge_requests
    - main
    - develop
  allow_failure: true
  when: manual

# ============================================================================
# STAGE 4: REPORT - Publish test reports and results
# ============================================================================

report:html:
  stage: report
  image: node:${NODE_VERSION}
  needs:
    - test:chromium
    - test:firefox
    - test:webkit
  script:
    - echo "📊 Generating HTML reports..."
    - ls -la reports/html-report/ || echo "No HTML reports found"
    - echo "✅ HTML reports ready"
  artifacts:
    paths:
      - reports/html-report/
    expire_in: 30 days
    when: always
  environment:
    name: test-reports
    url: $CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/reports/html-report/index.html
  only:
    - merge_requests
    - main
    - develop
    - schedules
  allow_failure: true

report:logs:
  stage: report
  image: node:${NODE_VERSION}
  needs:
    - test:chromium
    - test:firefox
    - test:webkit
  script:
    - echo "📝 Collecting test logs..."
    - mkdir -p reports/logs || true
    - ls -la reports/logs/ || echo "No logs found"
    - echo "✅ Logs collected"
  artifacts:
    paths:
      - reports/logs/
    expire_in: 30 days
    when: always
  only:
    - merge_requests
    - main
    - develop
    - schedules
  allow_failure: true

report:junit:
  stage: report
  image: node:${NODE_VERSION}
  needs:
    - test:chromium
    - test:firefox
    - test:webkit
  script:
    - echo "📋 Generating JUnit report..."
    - cat reports/junit.xml || echo "No JUnit report found"
    - echo "✅ JUnit report ready"
  artifacts:
    reports:
      junit: reports/junit.xml
    expire_in: 30 days
    when: always
  only:
    - merge_requests
    - main
    - develop
    - schedules
  allow_failure: true

# ============================================================================
# STAGE 5: CLEANUP - Clean up temporary artifacts
# ============================================================================

cleanup:artifacts:
  stage: cleanup
  image: node:${NODE_VERSION}-alpine
  script:
    - echo "🧹 Cleaning up artifacts..."
    - rm -rf reports/test-results.json || true
    - echo "✅ Cleanup completed"
  only:
    - merge_requests
    - main
    - develop
  when: always
  allow_failure: true

# ============================================================================
# Scheduled Jobs - Daily regression tests
# ============================================================================

# Daily regression test suite execution
daily:regression:
  stage: test
  image: node:${NODE_VERSION}
  needs:
    - install:dependencies
    - install:browsers
  script:
    - echo "📅 Running daily regression tests..."
    - npx playwright test --grep @functional --workers=${WORKERS}
    - echo "✅ Daily regression tests completed"
  artifacts:
    paths:
      - reports/
    reports:
      junit: reports/junit.xml
    expire_in: 30 days
  variables:
    BASE_URL: "${BASE_URL:-http://localhost:3000}"
    CI: "true"
  only:
    - schedules
  allow_failure: false
  retry:
    max: 1

# Daily full test suite on all browsers
daily:full:
  stage: test
  image: node:${NODE_VERSION}
  needs:
    - install:dependencies
    - install:browsers
  script:
    - echo "📅 Running daily full test suite..."
    - npx playwright test --workers=${WORKERS}
    - echo "✅ Daily full tests completed"
  artifacts:
    paths:
      - reports/
    reports:
      junit: reports/junit.xml
    expire_in: 30 days
  variables:
    BASE_URL: "${BASE_URL:-http://localhost:3000}"
    CI: "true"
  only:
    - schedules
  allow_failure: false
  retry:
    max: 1

# ============================================================================
# Merge Request Validation - Quick validation for PRs
# ============================================================================

# Quick validation job for merge requests
mr:validation:
  stage: test
  image: node:${NODE_VERSION}
  needs:
    - install:dependencies
    - install:browsers
  script:
    - echo "✔️ Running merge request validation..."
    - npx playwright test --grep @smoke --project=chromium
    - echo "✅ Merge request validation passed"
  variables:
    BASE_URL: "${BASE_URL:-http://localhost:3000}"
    CI: "true"
  only:
    - merge_requests
  allow_failure: false
  when: always

# ============================================================================
# Configuration validation
# ============================================================================

validate:setup:
  stage: install
  image: node:${NODE_VERSION}-alpine
  script:
    - echo "🔍 Validating setup configuration..."
    - node verify-setup.js || true
    - echo "✅ Setup validation completed"
  only:
    - merge_requests
    - main
    - develop
  allow_failure: true
  when: manual
